# Bestherm Illo Connect dry ceramic inertia heater (Wi-Fi, Tuya protocol 3.4).
# Shown in the Smart Life app as "HEATER-24EEW/EEBW/FEFW/AEFW".
# Same DPs as bestherm_nessaconnect_heater except no 101/102 (energy, usage),
# and DP 11 reports the active mode (comfor / eco) instead of the heating action.
# There is no current temperature DP.
name: Inertia heater
entities:
  - entity: climate
    translation_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 50
          max: 300
        mapping:
          - scale: 10
            step: 5
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: comfor
            value: comfort
          - dps_val: economics
            value: eco
          - dps_val: antifreezing
            value: away
          - dps_val: p1
            value: program_1
          - dps_val: p2
            value: program_2
          - dps_val: p3
            value: program_3
          - dps_val: prog
            value: external_control
  - entity: sensor
    name: Active mode
    category: diagnostic
    dps:
      - id: 11
        type: string
        name: sensor
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 13
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 13
        type: bitfield
        name: fault_code
  - entity: switch
    name: Open window detection
    category: config
    dps:
      - id: 105
        type: boolean
        name: switch
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 107
        type: integer
        name: value
        unit: C
        range:
          min: -5
          max: 5
        mapping:
          - scale: 10
